    <!-- LOGIKA FILTER JAVASCRIPT -->
<!-- LOGIKA FILTER & PENARIKAN DATA DINAMIS -->
    <script>
        let dataKatalogLokal = []; // Menampung data dari database secara lokal di browser
        let kategoriAktif = 'all';

        // Fungsi memanggil API backend saat halaman dimuat pertama kali
        async function ambilKatalogDariDatabase() {
            try {
                const respon = await fetch('/api/katalog-produk');
                const data = await respon.json();
                
                dataKatalogLokal = data;
                renderKartuKatalog(dataKatalogLokal);
            } catch (error) {
                console.error("Gagal memuat data katalog parfum:", error);
                document.getElementById('wadah-katalog').innerHTML = `
                    <div class="col-span-full text-center py-8 text-red-500 font-semibold">
                        Gagal memuat katalog produk. Silakan coba segarkan halaman.
                    </div>
                `;
            }
        }

        // Fungsi menyusun elemen HTML kartu produk secara dinamis berdasarkan data array
        function renderKartuKatalog(produkList) {
            const wadah = document.getElementById('wadah-katalog');
            wadah.innerHTML = ''; // Kosongkan wadah utama

            if (produkList.length === 0) {
                document.getElementById('produk-kosong').classList.remove('hidden');
                return;
            } else {
                document.getElementById('produk-kosong').classList.add('hidden');
            }

            produkList.forEach(item => {
                // Secara opsional, tentukan kategori/vibe aroma berdasarkan nama (simulasi pengelompokan)
                let kategori = 'fresh';
                if (item.nama.toLowerCase().includes('vanilla') || item.nama.toLowerCase().includes('opium')) kategori = 'sweet';
                if (item.nama.toLowerCase().includes('sauvage') || item.nama.toLowerCase().includes('woody')) kategori = 'woody';

                wadah.innerHTML += `
                    <div class="kartu-produk bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col" data-kategori="${kategori}" data-nama="${item.nama.toLowerCase()}">
                        <div class="h-60 bg-slate-100 flex items-center justify-center text-slate-400 font-medium text-xs">
                            📸 [ Foto ${item.nama} ]
                        </div>
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase block mb-1">${item.brand}</span>
                                <h3 class="nama-item font-semibold text-slate-900 text-lg mb-1">${item.nama}</h3>
                                <p class="text-xs text-slate-500 line-clamp-2 mb-3">${item.deskripsi}</p>
                            </div>
                            <div>
                                <div class="flex items-baseline gap-1 mb-4">
                                    <span class="text-xs text-slate-400">Mulai dari</span>
                                    <span class="font-bold text-slate-900 text-lg">Rp${item.harga_terendah.toLocaleString('id-ID')}</span>
                                </div>
                                <a href="detail.html?id_parfum=${item.nama}" class="block w-full text-center bg-slate-50 border border-slate-200 text-slate-800 text-sm font-semibold py-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition">
                                    Lihat Detail
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Fungsi Filter Kategori Tombol Atas
        function filterKategori(kategori) {
            kategoriAktif = kategori;
            
            const tombols = document.querySelectorAll('.btn-kategori');
            tombols.forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
                btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            });
            event.currentTarget.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
            event.currentTarget.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');

            eksekusiFilterGabungan();
        }

        // Fungsi Pencarian Teks Kotak Cari
        function filterKatalog() {
            eksekusiFilterGabungan();
        }

        // Fungsi penyaring gabungan antara tombol kategori dan kata kunci ketikan
        function eksekusiFilterGabungan() {
            const kataKunci = document.getElementById('cari-parfum').value.toLowerCase();
            const kartu = document.querySelectorAll('.kartu-produk');
            let adaProduk = false;

            kartu.forEach(card => {
                const kat = card.getAttribute('data-kategori');
                const nam = card.getAttribute('data-nama');

                const cocokKategori = (kategoriAktif === 'all' || kat === kategoriAktif);
                const cocokNama = nam.includes(kataKunci);

                if (cocokKategori && cocokNama) {
                    card.classList.remove('hidden');
                    adaProduk = true;
                } else {
                    card.classList.add('hidden');
                }
            });

            const pesanKosong = document.getElementById('produk-kosong');
            if (adaProduk) pesanKosong.classList.add('hidden');
            else pesanKosong.classList.remove('hidden');
        }

        // Eksekusi fungsi penarikan data saat browser selesai memuat DOM halaman
        document.addEventListener('DOMContentLoaded', ambilKatalogDariDatabase);
    </script>
