<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Pembayaran - Scentsation Decant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0">
                    <a href="index.html" class="serif-title text-2xl font-bold tracking-wider text-slate-900">SCENTSATION</a>
                </div>
                <div class="hidden md:flex space-x-8 font-medium text-sm text-slate-600">
                    <a href="index.html" class="hover:text-slate-900 px-1 pt-1 transition">Home</a>
                    <a href="katalog.html" class="hover:text-slate-900 px-1 pt-1 transition">Katalog Parfum</a>
                    <a href="riwayat.html" class="hover:text-slate-900 px-1 pt-1 transition">Riwayat Belanja</a>
                    
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-medium text-slate-700 hidden sm:inline">Dwifi Parizza</span>
                    <div class="w-8 h-8 rounded-full bg-slate-200 border border-slate-300 overflow-hidden flex items-center justify-center text-xs font-bold text-slate-600">DP</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- FORM KONFIRMASI PEMBAYARAN -->
    <main class="max-w-2xl mx-auto px-4 py-12 w-full">
        <div class="bg-white p-6 sm:p-10 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            
            <div class="text-center">
                <h1 class="serif-title text-2xl sm:text-3xl font-bold text-slate-900">Konfirmasi Pembayaran</h1>
                <p class="text-xs text-slate-500 mt-2">Kirimkan bukti transfer Anda agar pesanan dapat segera kami proses.</p>
            </div>

            <form action="#" method="POST" class="space-y-4" onsubmit="event.preventDefault(); alert('Konfirmasi berhasil dikirim! Admin akan memeriksa pesanan Anda.');">
                
                <!-- ID Transaksi -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">ID Transaksi / Kode Pesanan</label>
                    <input type="text" placeholder="Contoh: #TRX-96540" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 font-mono" required>
                </div>

                <!-- Metode Pembayaran Asal & Tujuan -->
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Transfer Dari (Nama Bank/E-Wallet)</label>
                        <input type="text" placeholder="Contoh: BCA / DANA" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Atas Nama Pemilik Rekening</label>
                        <input type="text" placeholder="Contoh: Dwifi Parizza" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400" required>
                    </div>
                </div>

                <!-- Nominal Transfer -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Jumlah yang Ditransfer (Rp)</label>
                    <input type="number" placeholder="Contoh: 135000" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 font-semibold" required>
                </div>

                <!-- UPLOAD BUKTI TRANSFER (IMAGE/FILE) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Unggah Bukti Transfer</label>
                    <div id="drop-area" class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center bg-slate-50 hover:bg-slate-100/50 transition relative flex flex-col items-center justify-center min-h-[160px]">
                        <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewImage(this)">
                        
                        <!-- Konten Default -->
                        <div id="upload-prompt" class="space-y-2">
                            <span class="text-2xl block">📸</span>
                            <p class="text-xs font-semibold text-slate-700">Pilih foto atau tarik gambar ke sini</p>
                            <p class="text-[10px] text-slate-400">Format: JPG, JPEG, PNG (Maks. 2MB)</p>
                        </div>

                        <!-- Konten Pratonton/Preview Gambar -->
                        <div id="image-preview-container" class="hidden w-full flex flex-col items-center gap-2">
                            <img id="image-preview" src="#" alt="Pratonton Bukti Transfer" class="max-h-32 object-contain rounded-lg border border-slate-200 shadow-sm">
                            <span class="text-[10px] text-slate-500 font-semibold truncate max-w-xs" id="file-name"></span>
                            <button type="button" onclick="resetUpload()" class="text-[10px] text-red-500 font-bold hover:underline">Hapus & Ganti Gambar</button>
                        </div>
                    </div>
                </div>

                <!-- TOMBOL SUBMIT -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition shadow-sm">
                        Kirim Konfirmasi Pembayaran
                    </button>
                </div>
            </form>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500 w-full">
        <p>&copy; 2026 Scentsation Decant. Hak Cipta Dilindungi.</p>
    </footer>

    <!-- INTERAKTIF UPLOAD JAVASCRIPT -->
    <script>
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                // Validasi ukuran file (2MB = 2097152 bytes)
                if (file.size > 2097152) {
                    alert("Ukuran file terlalu besar! Maksimal ukuran adalah 2MB.");
                    resetUpload();
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('file-name').innerText = file.name;
                    
                    // Tukar tampilan kontainer
                    document.getElementById('upload-prompt').classList.add('hidden');
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function resetUpload() {
            document.getElementById('file-input').value = "";
            document.getElementById('upload-prompt').classList.remove('hidden');
            document.getElementById('image-preview-container').classList.add('hidden');
        }
    </script>
</body>
</html>
