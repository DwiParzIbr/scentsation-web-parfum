<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Scentsation Decant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-xl space-y-6 relative overflow-hidden">
        
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-slate-50 rounded-full -z-10"></div>
        
        <div class="text-center space-y-2">
            <a href="../index.html" class="serif-title text-3xl font-bold tracking-wider text-slate-900 block">SCENTSATION</a>
            <span class="inline-block text-[10px] font-bold tracking-widest text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md uppercase">
                Owner Control Panel
            </span>
            <p class="text-xs text-slate-400 pt-1">Silakan masuk untuk mengelola stok parfum dan pesanan.</p>
        </div>

        <form action="/auth/admin-login" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5 tracking-wider">Username Admin</label>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400 text-sm">👤</span>
                    <input type="text" name="username" placeholder="Masukkan username Anda" 
                           class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition" 
                           required autocomplete="off">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Password</label>
                </div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400 text-sm">🔑</span>
                    <input type="password" id="input-password" name="password" placeholder="••••••••" 
                           class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-900 focus:bg-white transition" 
                           required>
                    <button type="button" onclick="togglePassword()" class="absolute right-4 text-xs font-bold text-slate-400 hover:text-slate-600 focus:outline-none select-none">
                        LIHAT
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition shadow-md hover:shadow-lg text-sm tracking-wide">
                    Masuk ke Dasbor Admin
                </button>
            </div>
            
        </form>

        <div class="text-center pt-2">
            <a href="../index.html" class="text-xs text-slate-400 hover:text-slate-900 hover:underline transition">
                ← Kembali ke Halaman Toko Utama
            </a>
        </div>

    </div>

    <script>
        // Fungsi untuk menyembunyikan atau melihat ketikan password secara realtime
        function togglePassword() {
            const passwordField = document.getElementById('input-password');
            const toggleButton = event.currentTarget;
            
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleButton.innerText = "SEMBUNYI";
            } else {
                passwordField.type = "password";
                toggleButton.innerText = "LIHAT";
            }
        }
    </script>
</body>
</html>
